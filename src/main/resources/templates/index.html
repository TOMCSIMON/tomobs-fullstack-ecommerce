<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToMobs</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/chatbot.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<div th:insert="~{fragments/navbar :: navbar}"></div>

<section class="hero">
    <div class="banner">
        <a th:href="@{/products}">
            <img th:src="@{/images/ToMobs-Homepage-Banner-1.webp}" alt="Banner" class="banner-img">
        </a>
    </div>
</section>

<main class="container">
    <section class="section">
        <h3 class="Brands">Pick your favourite brand</h3>
        <div class="brand-grid">
            <div class="brand-card"><img th:src="@{/images/Brand-image-1.png}" alt="OnePlus"></div>
            <div class="brand-card"><img th:src="@{/images/Brand-image-2.webp}" alt="Samsung"></div>
            <div class="brand-card"><img th:src="@{/images/Brand-image-3.webp}" alt="Vivo"></div>
            <div class="brand-card"><img th:src="@{/images/Brand-image-4.png}" alt="Apple"></div>
        </div>
    </section>

    <section class="section">
        <h2>Latest Releases</h2>
        <div class="product-grid">
            <div class="product-card">
                <span class="badge">NEW</span>
                <img th:src="@{/images/prdt-img-1.jpeg}" alt="Phone">
            </div>
            <div class="product-card">
                <span class="badge">NEW</span>
                <img th:src="@{/images/prdt-img-2.jpg}" alt="Phone">
            </div>
            <div class="product-card">
                <span class="badge">NEW</span>
                <img th:src="@{/images/prdt-img-3.webp}" alt="Phone">
            </div>
            <div class="product-card">
                <span class="badge">NEW</span>
                <img th:src="@{/images/prdt-img-4.webp}" alt="Phone">
            </div>
        </div>
    </section>

    <section class="section">
        <h2>For Your Budget</h2>
        <div class="budget-grid">
            <div class="budget-card" style="background-image: url('/images/budgt-img-1.webp');">
                <span>Under ₹5,000</span>
            </div>
            <div class="budget-card" style="background-image: url('/images/budgt-img-1.webp');">
                <span>Under ₹10,000</span>
            </div>
            <div class="budget-card" style="background-image: url('/images/budgt-img-1.webp');">
                <span>Under ₹25,000</span>
            </div>
            <div class="budget-card" style="background-image: url('/images/budgt-img-1.webp');">
                <span>Under ₹50,000</span>
            </div>
        </div>
    </section>

    <section class="section">
        <h2>iphones at ToMobs</h2>
        <div class="iphone-grid">
            <div class="iphone-card">
                <img th:src="@{/images/iphone-image-1.webp}" alt="iphone">
            </div>
            <div class="iphone-card">
                <img th:src="@{/images/iphone-image-2.webp}" alt="iphone">
            </div>
            <div class="iphone-card">
                <img th:src="@{/images/iphone-image-3.webp}" alt="iphone">
            </div>
            <div class="iphone-card">
                <img th:src="@{/images/iphone-image-4.webp}" alt="iphone">
            </div>
        </div>

    </section>
</main>
<div th:insert="~{fragments/footer :: footer}"></div>

<div th:replace="~{fragments/chatbot :: chatbot}"></div>

<script th:src="@{/js/chatbot.js}"></script>
</body>
</html>
