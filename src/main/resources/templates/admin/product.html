<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/css/admin-layout.css}">
    <link rel="stylesheet" th:href="@{/css/admin-product.css}">
</head>
<body>
<div th:replace="~{fragments/admin-navbar :: adminNavbar}"></div>
<div th:replace="~{fragments/admin-sidebar :: adminSidebar}"></div>

<div class="main-content">
    <div class="container my-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-0">Products</h1>
            <a th:href="@{/admin/products/add}" class="btn btn-black text-decoration-none">
                + Add Product
            </a>
        </div>

        <form th:action="@{/admin/products}" method="get" id="searchForm">
            <div class="search-wrapper">
                <input type="text" id="searchInput" name="keyword" th:value="${param.keyword}" placeholder="Search products by name....">
                <button type="button" id="clearSearch" class="clear-btn" style="display: none;">
                    <i class="bi bi-x"></i>
                </button>
                <i class="bi bi-search search-icon"></i>
            </div>
        </form>

        <div class="table-card">
            <div class="table-responsive">
                <table class="table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>PRODUCT NAME</th>
                        <th>CATEGORY</th>
                        <th>BRAND</th>
                        <th>ACTIONS</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="product, stat : ${products}">
                        <td th:text="${stat.count}"></td>
                        <td th:text="${product.productName}" style="font-weight: 600; color: #212529;"></td>
                        <td th:text="${product.categoryName}"></td>
                        <td th:text="${product.brandName}"></td>

                        <td>
                            <a th:href="@{/admin/products/edit/{id}(id=${product.productId})}" class="btn btn-sm btn-outline-secondary me-2">
                                <i class="bi bi-pencil-square"></i>
                            </a>

                            <button type="button"
                                    class="btn btn-sm btn-outline-danger"
                                    data-bs-toggle="modal"
                                    data-bs-target="#deleteProductModal"
                                    th:data-id="${product.productId}"
                                    th:data-name="${product.productName}">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(products)}">
                        <td colspan="5" class="text-center py-4 text-muted">No products found. Add some new products!</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination-container" th:if="${totalPages > 1}">
                <a th:if="${currentPage > 0}" th:href="@{/admin/products(page=${currentPage - 1}, size=5)}" class="page-box">
                    &lt;
                </a>
                <a th:unless="${currentPage > 0}" class="page-box disabled">&lt;</a>

                <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                   th:href="@{/admin/products(page=${i}, size=5)}"
                   class="page-box" th:classappend="${currentPage == i} ? 'active' : ''"
                   th:text="${i + 1}">1</a>

                <a th:if="${currentPage < totalPages - 1}" th:href="@{/admin/products(page=${currentPage + 1}, size=5)}" class="page-box">
                    &gt;
                </a>
                <a th:unless="${currentPage < totalPages - 1}" class="page-box disabled">&gt;</a>
            </div>
        </div>

    </div>
</div>

<div class="modal fade" id="deleteProductModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-center p-4" style="border-radius: 12px;">
            <div class="d-flex justify-content-end">
                <button type="button" class="btn-close fs-4" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body pt-0">
                <h2 class="fw-bold mb-4" style="font-size: 2rem; color: #dc3545;">ARE YOU SURE?</h2>
                <h4 class="mb-4" style="color: #333; line-height: 1.5;">
                    Do you really want to delete <br><span id="deleteProductName" class="fw-bold text-danger"></span>?
                </h4>
                <a href="#" id="confirmDeleteBtn" class="btn btn-danger px-5 py-2 fw-bold" style="border-radius: 8px; font-size: 1.1rem;">
                    Yes, Delete
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin-product.js}"></script>
</body>
</html>
