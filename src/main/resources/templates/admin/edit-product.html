<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - Admin</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/admin-layout.css}">
    <link rel="stylesheet" th:href="@{/css/admin-edit-product.css}">
</head>

<body>

<div th:replace="~{fragments/admin-navbar :: adminNavbar}"></div>

<div class="admin-layout d-flex justify-content-center">
    <main class="main-content mt-5 form-wrapper">

        <h2 class="page-title mb-4">Edit Product</h2>

        <form id="productForm" th:action="@{/admin/products/update}" method="post" th:object="${product}" enctype="multipart/form-data">

            <input type="hidden" th:field="*{id}" />

            <div class="custom-card mb-4">
                <div class="card-header-line">
                    <h4>Product Information</h4>
                </div>

                <div class="row mt-4">
                    <div class="col-md-6 mb-3">
                        <label class="custom-label">Product name</label>
                        <input type="text" th:field="*{productName}" class="custom-input form-control" placeholder="Enter Product name" required>
                        <div th:errors="*{productName}" class="text-danger small mt-1"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="custom-label">Category name</label>
                        <select th:field="*{categoryId}" class="custom-input form-select" required>
                            <option value="">Select Category Name</option>
                            <option th:each="c: ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                        </select>
                        <div th:errors="*{categoryId}" class="text-danger small mt-1"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="custom-label">Brand name</label>
                        <select th:field="*{brandId}" class="custom-input form-select" required>
                            <option value="">Select Brand Name</option>
                            <option th:each="b: ${brands}" th:value="${b.id}" th:text="${b.name}"></option>
                        </select>
                        <div th:errors="*{brandId}" class="text-danger small mt-1"></div>
                    </div>
                </div>
            </div>

            <div id="variants-container">
                <div th:each="variant, stat : *{variants}" class="custom-card mb-4 variant-block" th:data-index="${stat.index}">

                    <div class="card-header-line d-flex justify-content-between align-items-center">
                        <h4 class="variant-title" th:text="'Variant Information ' + (${stat.index} + 1)">Variant Information</h4>
                        <button type="button" class="btn btn-sm btn-outline-danger remove-variant-btn jump-btn" title="Remove Variant">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>

                    <div class="row mt-4">
                        <input type="hidden" th:field="*{variants[__${stat.index}__].id}" />

                        <div class="col-md-2 col-sm-6 mb-3">
                            <label class="custom-label">Variant name</label>
                            <input type="text" th:field="*{variants[__${stat.index}__].variantName}" class="custom-input form-control" placeholder="Variant name">
                        </div>
                        <div class="col-md-2 col-sm-6 mb-3">
                            <label class="custom-label">SKU code</label>
                            <input type="text" th:field="*{variants[__${stat.index}__].skuCode}" class="custom-input form-control" placeholder="SKU">
                        </div>
                        <div class="col-md-2 col-sm-6 mb-3">
                            <label class="custom-label">Stock</label>
                            <input type="number" th:field="*{variants[__${stat.index}__].stock}" class="custom-input form-control" placeholder="Stock">
                        </div>
                        <div class="col-md-2 col-sm-6 mb-3">
                            <label class="custom-label">Color</label>
                            <input type="text" th:field="*{variants[__${stat.index}__].color}" class="custom-input form-control" placeholder="Color">
                        </div>
                        <div class="col-md-2 col-sm-6 mb-3">
                            <label class="custom-label">Price</label>
                            <input type="number" step="0.01" th:field="*{variants[__${stat.index}__].price}" class="custom-input form-control" placeholder="Price">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-2 col-sm-6 mb-3">
                            <label class="custom-label">RAM</label>
                            <select th:field="*{variants[__${stat.index}__].ram}" class="custom-input form-select">
                                <option value="">RAM</option>
                                <option value="4GB">4 GB</option>
                                <option value="6GB">6 GB</option>
                                <option value="8GB">8 GB</option>
                                <option value="12GB">12 GB</option>
                                <option value="16GB">16 GB</option>
                            </select>
                        </div>
                        <div class="col-md-2 col-sm-6 mb-3">
                            <label class="custom-label">Storage</label>
                            <select th:field="*{variants[__${stat.index}__].storage}" class="custom-input form-select">
                                <option value="">Storage</option>
                                <option value="64GB">64 GB</option>
                                <option value="128GB">128 GB</option>
                                <option value="256GB">256 GB</option>
                                <option value="512GB">512 GB</option>
                                <option value="1TB">1 TB</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3 mt-2">
                        <label class="custom-label">Features</label>
                        <textarea th:field="*{variants[__${stat.index}__].keyFeatures}" class="custom-input custom-textarea form-control" placeholder="Add Features"></textarea>
                    </div>

                    <div class="mb-3 mt-3">
                        <label class="custom-label">Existing Images</label>
                        <div class="d-flex flex-wrap gap-3 existing-images-container">
                            <div th:each="img : ${variant.existingImages}" class="preview-image-wrapper">
                                <img th:src="@{${img.imageUrl}}" class="preview-image">
                                <button type="button" class="delete-existing-img-btn" th:data-image-id="${img.id}">&times;</button>
                            </div>
                        </div>
                        <p th:if="${#lists.isEmpty(variant.existingImages)}" class="text-muted small">No existing images found.</p>
                    </div>

                    <div class="mb-4 mt-3">
                        <label class="custom-label">Upload New Images</label>
                        <div class="custom-file-upload custom-input p-0">
                            <input type="file" th:field="*{variants[__${stat.index}__].newImages}" class="d-none file-input-actual" th:id="'file-' + ${stat.index}" accept="image/*">
                            <label th:for="'file-' + ${stat.index}" class="file-upload-label m-0">
                                <span class="browse-btn">Browse</span>
                                <span class="file-text">Click to add an image</span>
                            </label>
                        </div>
                        <div class="image-preview-container d-flex flex-wrap mt-3 gap-3"></div>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-5 pb-5 mt-2">
                <button type="button" id="add-variant-btn" class="btn-black jump-btn">Add New Variant</button>

                <div class="d-flex gap-3">
                    <button type="submit" class="btn-green jump-btn">Update Product</button>
                    <a th:href="@{/admin/products}" class="btn-red jump-btn text-decoration-none">Cancel</a>
                </div>
            </div>
        </form>
    </main>
</div>

<div class="modal fade" id="cropperModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content custom-card">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold">Crop Image</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center">
                <div class="img-container" style="max-height: 400px; overflow: hidden; background: #f9f9f9; border-radius: 8px;">
                    <img id="imageToCrop" src="" style="max-width: 100%; display: block;">
                </div>
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-black jump-btn" id="cropAndSaveBtn">Crop & Save</button>
            </div>
        </div>
    </div>
</div>

<template id="variant-template">
    <div class="custom-card mb-4 variant-block" data-index="__index__">
        <div class="card-header-line d-flex justify-content-between align-items-center">
            <h4 class="variant-title">Variant Information</h4>
            <button type="button" class="btn btn-sm btn-outline-danger remove-variant-btn jump-btn" title="Remove Variant">
                <i class="bi bi-trash"></i>
            </button>
        </div>

        <div class="row mt-4">
            <input type="hidden" name="variants[__index__].id" value="" />
            <div class="col-md-2 col-sm-6 mb-3">
                <label class="custom-label">Variant name</label>
                <input type="text" name="variants[__index__].variantName" class="custom-input form-control" placeholder="Variant name">
            </div>
            <div class="col-md-2 col-sm-6 mb-3">
                <label class="custom-label">SKU code</label>
                <input type="text" name="variants[__index__].skuCode" class="custom-input form-control" placeholder="SKU">
            </div>
            <div class="col-md-2 col-sm-6 mb-3">
                <label class="custom-label">Stock</label>
                <input type="number" name="variants[__index__].stock" class="custom-input form-control" placeholder="Stock">
            </div>
            <div class="col-md-2 col-sm-6 mb-3">
                <label class="custom-label">Color</label>
                <input type="text" name="variants[__index__].color" class="custom-input form-control" placeholder="Color">
            </div>
            <div class="col-md-2 col-sm-6 mb-3">
                <label class="custom-label">Price</label>
                <input type="number" step="0.01" name="variants[__index__].price" class="custom-input form-control" placeholder="Price">
            </div>
        </div>

        <div class="row">
            <div class="col-md-2 col-sm-6 mb-3">
                <label class="custom-label">RAM</label>
                <select name="variants[__index__].ram" class="custom-input form-select">
                    <option value="">RAM</option>
                    <option value="4 GB">4 GB</option>
                    <option value="6 GB">6 GB</option>
                    <option value="8 GB">8 GB</option>
                    <option value="12 GB">12 GB</option>
                    <option value="16 GB">16 GB</option>
                </select>
            </div>
            <div class="col-md-2 col-sm-6 mb-3">
                <label class="custom-label">Storage</label>
                <select name="variants[__index__].storage" class="custom-input form-select">
                    <option value="">Storage</option>
                    <option value="64 GB">64 GB</option>
                    <option value="128 GB">128 GB</option>
                    <option value="256 GB">256 GB</option>
                    <option value="512 GB">512 GB</option>
                    <option value="1 TB">1 TB</option>
                </select>
            </div>
        </div>

        <div class="mb-3 mt-2">
            <label class="custom-label">Features</label>
            <textarea name="variants[__index__].keyFeatures" class="custom-input custom-textarea form-control" placeholder="Add Features"></textarea>
        </div>

        <div class="mb-4 mt-3">
            <label class="custom-label">Upload Images</label>
            <div class="custom-file-upload custom-input p-0">
                <input type="file" name="variants[__index__].newImages" class="d-none file-input-actual" id="file-new-__index__" accept="image/*">
                <label for="file-new-__index__" class="file-upload-label m-0">
                    <span class="browse-btn">Browse</span>
                    <span class="file-text">Click to add an image</span>
                </label>
            </div>
            <div class="image-preview-container d-flex flex-wrap mt-3 gap-3"></div>
        </div>
    </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script th:src="@{/js/admin-edit-product.js}"></script>

</body>
</html>
