<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/css/admin-layout.css}">
    <link rel="stylesheet" th:href="@{/css/user-list.css}">
</head>
<body>
<div th:replace="~{fragments/admin-navbar :: adminNavbar}"></div>
<div th:replace="~{fragments/admin-sidebar :: adminSidebar}"></div>

<div class="main-content">
    <div class="container my-4">

        <h1>Users</h1>

        <form th:action="@{/admin/users}" method="get" id="searchForm">
            <div class="search-wrapper">
                <input type="text" id="searchInput" name="keyword" th:value="${keyword}" placeholder="Search users....">
                <button type="button" id="clearSearch" class="clear-btn">
                    <i class="bi bi-x"></i>
                </button>
                <i class="bi bi-search search-icon"></i>
            </div>
        </form>

        <div class="table-card">
            <div class="table-responsive">
                <table class="table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>USER NAME</th>
                        <th>EMAIL</th>
                        <th>STATUS</th>
                        <th>ACTIONS</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}">1</td>
                        <td th:text="${user.name}" style="font-weight: 600; color: #212529;">Zacharia</td>
                        <td th:text="${user.email}">zacharia@gmail.com</td>

                        <td class="user-status"
                            th:text="${user.isBlocked ? 'Blocked' : 'Active'}"
                            th:style="${user.isBlocked ? 'color: #dc3545; font-weight: 600;' : ''}">
                            Active
                        </td>
                        <td>
                            <button class="btn btn-black toggle-btn"
                                    th:data-id="${user.id}"
                                    th:data-blocked="${user.isBlocked}"
                                    onclick="openConfirmModal(this)">
                                <span th:text="${user.isBlocked ? 'Unblock' : 'Block'}">Block</span>
                            </button>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="5" class="text-center py-4 text-muted">No users found matching your search.</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination-container" th:if="${totalPage > 1}">
                <a th:href="@{/admin/users(page=${currentPage - 1}, keyword=${keyword})}"
                   class="page-box" th:classappend="${currentPage == 0} ? 'disabled' : ''">
                    &lt;
                </a>

                <a th:each="i : ${#numbers.sequence(0, totalPage - 1)}"
                   th:href="@{/admin/users(page=${i}, keyword=${keyword})}"
                   class="page-box" th:classappend="${currentPage == i} ? 'active' : ''"
                   th:text="${i + 1}">1</a>

                <a th:href="@{/admin/users(page=${currentPage + 1}, keyword=${keyword})}"
                   class="page-box" th:classappend="${currentPage == totalPage - 1} ? 'disabled' : ''">
                    &gt;
                </a>
            </div>
        </div>
    </div>

    <div class="modal fade" id="confirmBlockModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-4" style="border-radius: 12px;">

                <div class="d-flex justify-content-end">
                    <button type="button" class="btn-close fs-4" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body pt-0">
                    <h2 class="fw-bold mb-4" style="font-size: 2rem;">ARE YOU SURE!</h2>

                    <h4 class="mb-4" style="color: #333; line-height: 1.5;">
                        Do you really want to <span id="modalActionText" class="fw-bold">Block</span> the User?
                    </h4>

                    <button type="button" id="confirmActionBtn" class="btn btn-danger px-5 py-2 fw-bold"
                            style="border-radius: 8px; font-size: 1.1rem;">
                        Yes, Block
                    </button>
                </div>

            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/user-list.js}"></script>

</body>
</html>
