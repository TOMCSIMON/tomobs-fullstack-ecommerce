<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Category Management</title>
    <link rel="stylesheet" th:href="@{/css/admin-navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-category.css}">


    <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css}"
          rel="stylesheet">

</head>
<body style="background-color:#f1f3f6;">


<div th:replace="~{fragments/admin-navbar :: adminNavbar}"></div>

<div th:replace="~{fragments/admin-sidebar :: adminSidebar}"></div>

<div class="page-header">
    <h4>Categories</h4>
</div>

<div class="d-flex justify-content-between mb-2">

    <!-- COMMON FOR SEARCH BAR START -->
    <form th:action="@{/admin/categories}" method="get" class="mt-3 mb-2 search-bar d-flex justify-content-between">
        <input class="ms-3 w-100" type="search" name="keyword" th:value="${param.keyword}"
               placeholder="search category by name...">
        <img class="m-3 search-icon" th:src="@{/icons/search.png}" alt="search">
    </form>
    <!-- COMMON FOR SEARCH BAR END -->
    <button class="addButton" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
        Add Category
    </button>
</div>

<div id="toastMessage" style="display:none;" class="toast-success">Category Deleted Successfully</div>

<!--pageable-->
<div class="category-table justify-content-center mt-3">
    <table class="table">
        <thead>
        <tr>
            <th>ID</th>

            <th>Name</th>

            <th>Description</th>

            <th>Status</th>

            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="category : ${categories}">
            <td th:text="${category.id}"></td>
            <td th:text="${category.name}"></td>
            <td th:text="${category.description}"></td>
            <td th:text="${category.isActive} ? 'Active' : 'Blocked'"></td>


            <td>
                <!-- Edit (opens edit modal) -->
                <img th:src="@{/icons/edit.png}"
                     alt="Edit"
                     style="width:25px; height:25px; cursor:pointer;"
                     data-bs-toggle="modal"
                     data-bs-target="#editCategoryModal"
                     th:attr="data-id=${category.id},data-name=${category.name}, data-description=${category.description}, data-status=${category.isActive ? 'true' : 'false'}">

                <!-- Delete (opens delete modal) -->
                <img th:src="@{/icons/bin.png}"
                     alt="Delete"
                     style="width:25px; height:25px; cursor:pointer; margin-left:10px;"
                     data-bs-toggle="modal"
                     data-bs-target="#deleteCategoryModal"
                     th:attr="data-id=${category.id},data-name=${category.name}">
            </td>

        </tr>
        </tbody>
    </table>
</div>

<nav aria-label="Page navigation" class="mt-3 mb-3 ms-5">
    <ul class="pagination justify-content-center">

        <!-- Previous Button -->
        <li class="page-item mx-1 btn-dark"
            th:classappend="${currentPage == 0} ? 'disabled'">
            <a class="page-link"
               th:classappend="${currentPage == 0} ? 'disabled'"
               th:href="@{/admin/categories(
                    page=${currentPage - 1},
                    size=5,
                    sortField=${sortField},
                    sortDir=${sortDir}
               )}"> < </a>
        </li>

        <!-- Page Numbers -->
        <li class="page-item mx-1"
            th:each="i : ${#numbers.sequence(0, totalPage - 1)}"
            th:classappend="${i == currentPage} ? 'active'">
            <a class="page-link"
               th:text="${i + 1}"
               th:href="@{/admin/categories(
                    page=${i},
                    size=5,
                    sortField=${sortField},
                    sortDir=${sortDir}
               )}"></a>
        </li>

        <!-- Next Button -->
        <li class="page-item mx-1" th:classappend="${currentPage == totalPage - 1} ? 'disabled'">
            <a class="page-link"
               th:classappend="${currentPage == totalPage - 1} ? 'disabled'"
               th:href="@{/admin/categories(
                    page=${currentPage + 1},
                    size=5,
                    sortField=${sortField},
                    sortDir=${sortDir}
               )}"> > </a>
        </li>

    </ul>
</nav>
<!--pageable-->

<!--Add Modal-->
<div class="modal fade" id="addCategoryModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Add Category</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <form th:action="@{/admin/categories/new}" th:object="${categoryDTO}" method="post">

                <div class="modal-body">

                    <div class="mb-3">
                        <label>Category Name</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label>Description</label>
                        <textarea name="description" class="form-control"></textarea>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="submit" class="btn btn-success">Save</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>

            </form>

        </div>
    </div>
</div>

<!-- Delete Category Modal  -->
<div class="modal fade" id="deleteCategoryModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <!-- Modal header -->
            <div class="modal-header">
                <h5 class="modal-title">Delete Category <span id="deleteCategoryName"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <!-- Modal body -->
            <div class="modal-body">
                Are you sure you want to delete this category?
            </div>

            <!-- Modal footer -->
            <div class="modal-footer">
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>

        </div>
    </div>
</div>

<!-- Edit Category Modal -->
<div class="modal fade" id="editCategoryModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <!-- Modal header -->
            <div class="modal-header">
                <h5 class="modal-title">Edit Category <span id="editCategoryName"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <form th:action="@{/admin/categories/edit/__id__}" method="post" id="editCategoryForm">
                <div class="modal-body">

                    <div class="mb-3">
                        <label>Category Name</label>
                        <input type="text" name="name" class="form-control" id="editCategoryNameInput">
                    </div>

                    <div class="mb-3">
                        <label>Description</label>
                        <textarea name="description" class="form-control" id="editCategoryDescriptionInput"></textarea>
                    </div>

                    <div class="mb-3 form-check">
                        <!-- Hidden input that will hold the actual value to be submitted -->
                        <input type="hidden" name="active" id="editCategoryStatusHidden" value="false">
                        <input type="checkbox" class="form-check-input" id="editCategoryStatusInput">
                        <label class="form-check-label" for="editCategoryStatusInput">Active</label>
                    </div>

                </div>

                <!-- Modal footer -->
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success">Save Changes</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>

            </form>

        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous">
</script>

<script th:src="@{/js/admin-category.js}"></script>

</body>
</html>
