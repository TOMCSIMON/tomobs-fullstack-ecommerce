<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/css/admin-layout.css}">
    <link rel="stylesheet" th:href="@{/css/admin-category.css}">
</head>
<body>
<div th:replace="~{fragments/admin-navbar :: adminNavbar}"></div>
<div th:replace="~{fragments/admin-sidebar :: adminSidebar}"></div>

<div class="main-content">
    <div class="container my-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-0">Categories</h1>
            <button class="btn btn-black" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
                + Add Category
            </button>
        </div>

        <form th:action="@{/admin/categories}" method="get" id="searchForm">
            <div class="search-wrapper">
                <input type="text" id="searchInput" name="keyword" th:value="${param.keyword}" placeholder="Search category by name....">
                <button type="button" id="clearSearch" class="clear-btn" style="display: none;">
                    <i class="bi bi-x"></i>
                </button>
                <i class="bi bi-search search-icon"></i>
            </div>
        </form>

        <div id="toastMessage" style="display:none;" class="toast-success">Category Deleted Successfully</div>

        <div class="table-card">
            <div class="table-responsive">
                <table class="table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>NAME</th>
                        <th>DESCRIPTION</th>
                        <th>STATUS</th>
                        <th>ACTIONS</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="category : ${categories}">
                        <td th:text="${category.id}"></td>
                        <td th:text="${category.name}" style="font-weight: 600; color: #212529;"></td>
                        <td th:text="${category.description}"></td>

                        <td class="category-status"
                            th:text="${category.isActive ? 'Active' : 'Blocked'}"
                            th:style="${!category.isActive ? 'color: #dc3545; font-weight: 600;' : ''}">
                        </td>

                        <td>
                            <button class="btn btn-sm btn-outline-secondary me-2"
                                    data-bs-toggle="modal"
                                    data-bs-target="#editCategoryModal"
                                    th:attr="data-id=${category.id},data-name=${category.name}, data-description=${category.description}, data-status=${category.isActive ? 'true' : 'false'}">
                                <i class="bi bi-pencil-square"></i>
                            </button>

                            <button class="btn btn-sm btn-outline-danger"
                                    data-bs-toggle="modal"
                                    data-bs-target="#deleteCategoryModal"
                                    th:attr="data-id=${category.id},data-name=${category.name}">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(categories)}">
                        <td colspan="5" class="text-center py-4 text-muted">No categories found matching your search.</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination-container" th:if="${totalPage > 1}">
                <a th:href="@{/admin/categories(page=${currentPage - 1}, size=5, sortField=${sortField}, sortDir=${sortDir}, keyword=${param.keyword})}"
                   class="page-box" th:classappend="${currentPage == 0} ? 'disabled' : ''">
                    &lt;
                </a>

                <a th:each="i : ${#numbers.sequence(0, totalPage - 1)}"
                   th:href="@{/admin/categories(page=${i}, size=5, sortField=${sortField}, sortDir=${sortDir}, keyword=${param.keyword})}"
                   class="page-box" th:classappend="${currentPage == i} ? 'active' : ''"
                   th:text="${i + 1}">1</a>

                <a th:href="@{/admin/categories(page=${currentPage + 1}, size=5, sortField=${sortField}, sortDir=${sortDir}, keyword=${param.keyword})}"
                   class="page-box" th:classappend="${currentPage == totalPage - 1} ? 'disabled' : ''">
                    &gt;
                </a>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addCategoryModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-3" style="border-radius: 12px;">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold fs-4">Add Category</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/admin/categories/new}" th:object="${categoryDTO}" method="post">
                    <div class="modal-body pt-0 text-start">
                        <div class="mb-3">
                            <label class="form-label text-muted small">Category Name</label>
                            <input type="text" name="name" class="form-control" style="border-radius: 8px;" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Description</label>
                            <textarea name="description" class="form-control" style="border-radius: 8px;"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-0 justify-content-center">
                        <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal" style="border-radius: 8px;">Cancel</button>
                        <button type="submit" class="btn btn-black px-5" style="border-radius: 8px;">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editCategoryModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-3" style="border-radius: 12px;">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold fs-4">Edit Category <span id="editCategoryName" class="text-muted fs-6"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/admin/categories/edit/__id__}" method="post" id="editCategoryForm">
                    <div class="modal-body pt-0 text-start">
                        <div class="mb-3">
                            <label class="form-label text-muted small">Category Name</label>
                            <input type="text" name="name" class="form-control" id="editCategoryNameInput" style="border-radius: 8px;">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Description</label>
                            <textarea name="description" class="form-control" id="editCategoryDescriptionInput" style="border-radius: 8px;"></textarea>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="hidden" name="active" id="editCategoryStatusHidden" value="false">
                            <input type="checkbox" class="form-check-input" id="editCategoryStatusInput">
                            <label class="form-check-label" for="editCategoryStatusInput">Active Status</label>
                        </div>
                    </div>
                    <div class="modal-footer border-0 justify-content-center">
                        <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal" style="border-radius: 8px;">Cancel</button>
                        <button type="submit" class="btn btn-black px-5" style="border-radius: 8px;">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="deleteCategoryModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-4" style="border-radius: 12px;">
                <div class="d-flex justify-content-end">
                    <button type="button" class="btn-close fs-4" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body pt-0">
                    <h2 class="fw-bold mb-4" style="font-size: 2rem; color: #dc3545;">ARE YOU SURE?</h2>
                    <h4 class="mb-4" style="color: #333; line-height: 1.5;">
                        Do you really want to delete <span id="deleteCategoryName" class="fw-bold"></span>?
                    </h4>
                    <button type="button" id="confirmDeleteBtn" class="btn btn-danger px-5 py-2 fw-bold" style="border-radius: 8px; font-size: 1.1rem;">
                        Yes, Delete
                    </button>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin-category.js}"></script>

</body>
</html>
