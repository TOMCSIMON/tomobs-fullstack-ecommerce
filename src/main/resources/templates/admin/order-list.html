<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders - Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/css/admin-layout.css}">
    <link rel="stylesheet" th:href="@{/css/order-list.css}">
</head>
<body>

<div th:replace="~{fragments/admin-navbar :: adminNavbar}"></div>
<div th:replace="~{fragments/admin-sidebar :: adminSidebar}"></div>

<div class="main-content">
    <div class="container my-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-0">Orders</h1>
        </div>

        <div class="row mb-4">
            <div class="col-md-4">
                <div class="stats-card">
                    <h6 class="text-muted mb-2">Total Orders</h6>
                    <h3 class="mb-0 fw-bold">324</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stats-card">
                    <h6 class="text-muted mb-2">Pending Orders</h6>
                    <h3 class="mb-0 fw-bold">23</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stats-card">
                    <h6 class="text-muted mb-2">Cancelled Orders</h6>
                    <h3 class="mb-0 fw-bold">23</h3>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4 gap-3 flex-wrap">
            <form th:action="@{/admin/orders}" method="get" id="searchForm" class="flex-grow-1" style="max-width: 450px;">
                <div class="search-wrapper mb-0">
                    <input type="text" id="searchInput" name="keyword" th:value="${param.keyword}" placeholder="Search orders....">
                    <button type="button" id="clearSearch" class="clear-btn" style="display: none;">
                        <i class="bi bi-x"></i>
                    </button>
                    <i class="bi bi-search search-icon"></i>
                </div>
            </form>

            <div class="d-flex gap-2">
                <select class="form-select custom-select" style="min-width: 150px;">
                    <option value="">Filter By</option>
                    <option value="processing">Processing</option>
                    <option value="delivered">Delivered</option>
                </select>
                <select class="form-select custom-select" style="min-width: 150px;">
                    <option value="">Sort By</option>
                    <option value="date_desc">Newest First</option>
                    <option value="date_asc">Oldest First</option>
                </select>
            </div>
        </div>

        <div class="table-card">
            <div class="table-responsive">
                <table class="table">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>TOTAL</th>
                        <th>PAYMENT</th>
                        <th>STATUS</th>
                        <th>DATE</th>
                        <th class="text-center">ACTIONS</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="order, stat : ${orders}">

                        <td th:text="${(currentPage * 5) + stat.count}"></td>

                        <td style="font-weight: 600; color: #212529;"
                            th:text="'₹ ' + ${#numbers.formatDecimal(order.totalAmount, 1, 'COMMA', 2, 'POINT')}">18,299.00</td>

                        <td th:text="${order.paymentType}">COD</td>

                        <td th:classappend="'status-' + ${#strings.toLowerCase(order.status)}"
                            th:text="${order.status}">PROCESSING</td>

                        <td th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy')}">14/02/2024</td>

                        <td class="text-center">
                            <a th:href="@{/admin/orders/edit/{id}(id=${order.id})}" class="btn btn-sm btn-outline-secondary">
                                <i class="bi bi-pencil-square"></i>
                            </a>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(orders)}">
                        <td colspan="6" class="text-center py-4 text-muted">No orders found matching your criteria.</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination-container" th:if="${totalPage > 1}">
                <a th:if="${currentPage > 0}" th:href="@{/admin/orders(page=${currentPage - 1}, size=5, keyword=${param.keyword})}" class="page-box">
                    &lt;
                </a>
                <a th:unless="${currentPage > 0}" class="page-box disabled">&lt;</a>

                <a th:each="i : ${#numbers.sequence(0, totalPage - 1)}"
                   th:href="@{/admin/orders(page=${i}, size=5, keyword=${param.keyword})}"
                   class="page-box" th:classappend="${currentPage == i} ? 'active' : ''"
                   th:text="${i + 1}">1</a>

                <a th:if="${currentPage < totalPage - 1}" th:href="@{/admin/orders(page=${currentPage + 1}, size=5, keyword=${param.keyword})}" class="page-box">
                    &gt;
                </a>
                <a th:unless="${currentPage < totalPage - 1}" class="page-box disabled">&gt;</a>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
