<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ToMobs Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/css/admin-layout.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
</head>
<body>

<div th:replace="~{fragments/admin-navbar :: adminNavbar}"></div>
<div th:replace="~{fragments/admin-sidebar :: adminSidebar}"></div>

<div class="main-content">
    <div class="container">

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <h1 class="mb-2 dashboard-title">Dashboard</h1>
            <div class="d-flex gap-2">
                <button id="exportPdfBtn" class="btn btn-dark-custom d-flex align-items-center gap-2">
                    <i class="bi bi-file-earmark-pdf"></i> Export PDF
                </button>
            </div>
        </div>

        <div class="row mb-4 g-3">
            <div class="col-md-4">
                <div class="stats-card">
                    <h6 class="text-muted mb-2">Overall Total Sales (Revenue)</h6>
                    <div class="d-flex align-items-end justify-content-between">
                        <h3 class="mb-0 fw-bold" th:text="'₹ ' + ${#numbers.formatDecimal(dashboard.totalSale != null ? dashboard.totalSale : 0, 1, 'COMMA', 2, 'POINT')}">0</h3>
                        <span class="trend-indicator"><i class="bi bi-arrow-up-right"></i> +5.2%</span>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stats-card">
                    <a th:href="@{/admin/orders}">
                        <h6 class="text-muted mb-2">Overall Total Orders</h6>
                        <div class="d-flex align-items-end justify-content-between">
                            <h3 class="mb-0 fw-bold" th:text="${dashboard.totalOrders}">0</h3>
                            <span class="trend-indicator"><i class="bi bi-arrow-up-right"></i> +12%</span>
                        </div>
                    </a>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stats-card">
                    <a th:href="@{/admin/users}">
                        <h6 class="text-muted mb-2">Reg. users</h6>
                        <div class="d-flex align-items-end justify-content-between">
                            <h3 class="mb-0 fw-bold" th:text="${dashboard.totalUsers}">0</h3>
                            <span class="trend-indicator"><i class="bi bi-arrow-up-right"></i> +12%</span>
                        </div>
                    </a>
                </div>
            </div>
        </div>

        <div class="filter-card mb-4 p-4">
            <h6 class="fw-bold mb-3">Filter Sales by Date Range</h6>
            <form class="row g-3 align-items-end" id="filterForm" th:action="@{/admin/dashboard}" method="GET">
                <div class="col-md-4">
                    <label for="startDate" class="form-label text-muted">Start Date</label>
                    <input type="date" class="form-control" id="startDate" name="startDate" th:value="${startDate}">
                </div>
                <div class="col-md-4">
                    <label for="endDate" class="form-label text-muted">End Date</label>
                    <input type="date" class="form-control" id="endDate" name="endDate" th:value="${endDate}">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-dark w-100">Apply Filter</button>
                </div>
                <div class="col-md-2">
                    <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary w-100">Reset</a>
                </div>
            </form>
        </div>

        <div class="row mb-4">
            <div class="col-12">
                <div class="chart-card">
                    <h6 class="fw-bold mb-4">Sales Trend (Revenue)</h6>
                    <div class="chart-container">
                        <canvas id="salesChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="table-card">
                    <h6 class="fw-bold mb-4">Sales Report Details</h6>
                    <div class="table-responsive">
                        <table class="table table-borderless mb-0">
                            <thead>
                            <tr>
                                <th>ORDER ID</th>
                                <th>CUSTOMER</th>
                                <th>AMOUNT</th>
                                <th>STATUS</th>
                                <th>DATE</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="sale : ${salesDetails.content}">
                                <td th:text="'#' + ${sale.id}">#1042</td>
                                <td th:text="${sale.userName}">Customer</td>
                                <td class="fw-bold"
                                    th:text="'₹ ' + ${#numbers.formatDecimal(sale.totalAmount, 1, 'COMMA', 2, 'POINT')}">
                                    ₹0.00
                                </td>
                                <td>
                                        <span class="status-badge"
                                              th:classappend="'status-' + ${#strings.toLowerCase(sale.status)}"
                                              th:text="${sale.status}">
                                            Status
                                        </span>
                                </td>
                                <td class="text-muted"
                                    th:text="${#temporals.format(sale.createdAt, 'dd/MM/yyyy')}">
                                    Date
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(salesDetails.content)}">
                                <td colspan="5" class="text-center text-muted py-4">No sales records found for this period.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script th:inline="javascript">
    /*<![CDATA[*/
    var chartLabels = /*[[${dashboard.labels}]]*/ [];
    var chartData = /*[[${dashboard.chartData}]]*/ [];
    /*]]>*/
</script>

<script th:src="@{/js/admin-dashboard.js}"></script>

</body>
</html>
