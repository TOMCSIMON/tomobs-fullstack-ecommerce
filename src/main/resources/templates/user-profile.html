<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - ToMobs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/user-profile.css}">
</head>
<body>

<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="container profile-wrapper">

    <h2 class="profile-title mb-4">My Profile Page</h2>

    <div class="profile-card">

        <div class="field-group mb-4">
            <label class="profile-label">
                Personal Information
                <i class="bi bi-pencil edit-icon" onclick="startEdit(this)" title="Edit Name"></i>
            </label>
            <input type="text" class="profile-input" th:value="${userDetails.name}" data-field="name" readonly>

            <div class="action-buttons d-none mt-2">
                <button class="btn btn-sm btn-success px-3 me-2" onclick="saveEdit(this)">Save</button>
                <button class="btn btn-sm btn-outline-secondary px-3" onclick="cancelEdit(this)">Cancel</button>
            </div>
        </div>

        <div class="field-group mb-4">
            <label class="profile-label">
                Email Address
                <i class="bi bi-pencil edit-icon" onclick="startEdit(this)" title="Edit Email"></i>
            </label>
            <input type="email" class="profile-input" th:value="${userDetails.email}" data-field="email" readonly>

            <div class="action-buttons d-none mt-2">
                <button class="btn btn-sm btn-success px-3 me-2" onclick="saveEdit(this)">Save</button>
                <button class="btn btn-sm btn-outline-secondary px-3" onclick="cancelEdit(this)">Cancel</button>
            </div>
        </div>

        <div class="field-group mb-4">
            <label class="profile-label">
                Phone number
                <i class="bi bi-pencil edit-icon" onclick="startEdit(this)" title="Edit Phone"></i>
            </label>
            <input type="text" class="profile-input" th:value="${userDetails.phoneNumber}" data-field="phoneNumber" readonly>

            <div class="action-buttons d-none mt-2">
                <button class="btn btn-sm btn-success px-3 me-2" onclick="saveEdit(this)">Save</button>
                <button class="btn btn-sm btn-outline-secondary px-3" onclick="cancelEdit(this)">Cancel</button>
            </div>
        </div>

        <div class="mt-2">
            <button class="btn-black">Change Password</button>
        </div>

    </div>
</div>

<div th:insert="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/user-profile.js}"></script>
</body>
</html>
