<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ToMobs</title>

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/order.css}">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background-color:#f1f3f6;">

<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="user-layout">

    <main class="flex-grow-1 mt-5 ms-4 mb-3  container">

        <!-- IF USER HAS NO ORDERS -->
        <div th:if="${orderItems == null or orderItems.isEmpty()}"
             class="text-center mt-5">

            <div>
                <img th:src="@{/images/No-order.webp}">
            </div>

            <h2 class="mb-3">Looks like you haven’t made your order yet</h2>

            <a th:href="@{/products}" class="btn btn-dark rounded px-4">
                Continue Shopping
            </a>
        </div>


        <div th:if="${orderItems != null and !orderItems.isEmpty()}">

            <h2 class="mt-5 mb-2">My Orders</h2>
            <!-- COMMON FOR SEARCH BAR START -->
            <form class="mt-3 mb-2 search-bar d-flex justify-content-between">
                <input class="ms-3 w-100" type="search" placeholder="search your orders here...">
                <img class="m-3 search-icon" th:src="@{/icons/search.png}" alt="search">
            </form>
            <!-- COMMON FOR SEARCH BAR END -->

            <!-- ORDERS LIST START-->
            <div class="orders-wrapper mt-4">

                <!-- ONE ORDER -->
                <div class="orders-box mb-3"
                     th:each="order : ${orderItems}">

                    <div class="order-row d-flex flex-column flex-md-row
                                align-items-start align-items-md-center
                                justify-content-between gap-3">

                        <!-- LEFT : IMAGE + NAME -->
                        <div class="d-flex align-items-center gap-3">

                            <img th:src="${order.imageUrl}"
                                 class="order-product-img"
                                 alt="product">

                            <div>
                                <div class="order-title"
                                     th:text="${order.variantName}">
                                    Product Name
                                </div>

                                <div class="order-subtitle"
                                     th:if="${order.totalItems > 1}"
                                     th:text="'+' + (${order.totalItems} - 1) + ' more items'">
                                </div>
                            </div>

                        </div>

                        <!-- CENTER : PRICE -->
                        <div class="order-price">
                            ₹<span th:text="${order.totalAmount}">0</span>
                        </div>

                        <!-- RIGHT : STATUS + BUTTON -->
                        <div class="text-end">

                            <div class="order-status mb-2">
                                Status:
                                <span th:text="${order.status}"
                                      th:classappend="
                          ${order.status.name() == 'CANCELLED'} ? 'text-danger' :
                          (${order.status.name() == 'DELIVERED'} ? 'text-success' :
                          'text-warning')">
                    </span>
                            </div>

                            <a th:href="@{/orders/{id}(id=${order.id})}"
                               class="btn btn-dark btn-sm rounded-pill px-3">
                                View Details
                            </a>

                        </div>

                    </div>
                </div>

                <!-- PAGINATION -->
                <nav th:if="${totalPages > 1}" class="mt-4 mb-5">
                    <ul class="pagination justify-content-center">

                        <!-- PREVIOUS -->
                        <li class="page-item"
                            th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/orders(page=${currentPage - 1})}">
                                Previous
                            </a>
                        </li>

                        <!-- PAGE NUMBERS -->
                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            th:classappend="${i == currentPage} ? 'active'">
                            <a class="page-link"
                               th:text="${i + 1}"
                               th:href="@{/orders(page=${i})}">
                            </a>
                        </li>

                        <!-- NEXT -->
                        <li class="page-item"
                            th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/orders(page=${currentPage + 1})}">
                                Next
                            </a>
                        </li>

                    </ul>
                </nav>
            </div>
            <!-- ORDERS LIST END-->
        </div>

    </main>
</div>
<div th:insert="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
