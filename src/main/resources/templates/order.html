<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | ToMobs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/order.css}">
</head>

<body>

<div th:insert="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">
    <div id="empty-state" th:if="${orderItems == null or orderItems.isEmpty()}" class="text-center py-5">
        <img th:src="@{/images/No-order.webp}" class="img-fluid mb-4" style="max-width: 300px;">
        <h2 class="fw-bold">Looks like you haven’t made your order yet</h2>
        <a th:href="@{/products}" class="btn btn-dark px-4 mt-3">Continue Shopping</a>
    </div>

    <div th:if="${orderItems != null and !orderItems.isEmpty()}" class="content-wrapper">
        <h1 class="page-title">My Orders</h1>

        <div class="search-order mb-4">
            <div class="search-pill">
                <input type="text" id="orderSearchInput" name="search" placeholder="Search Orders by product name..." aria-label="Search">
                <button type="button" class="border-0 bg-transparent">
                    <img th:src="@{/icons/search.png}" alt="search" class="search-icon">
                </button>
            </div>
        </div>

        <div id="orders-fragment-container" th:fragment="order-fragment">
            <div th:if="${orderItems.isEmpty()}" class="text-center py-5 my-4 bg-white rounded-4 shadow-sm border">
                <div class="mb-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="#dee2e6" class="bi bi-search" viewBox="0 0 16 16">
                        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                    </svg>
                </div>
                <h4 class="text-dark fw-bold">No orders found</h4>
                <p class="text-muted small">We couldn't find any orders matching your search.</p>
            </div>
            <div class="orders-list" th:if="${!orderItems.isEmpty()}">
                <a th:href="@{/orders/details/{id}(id=${order.id})}"
                   th:each="order : ${orderItems}"
                   class="order-card-link text-decoration-none">

                    <div class="order-card mb-3">
                        <div class="row align-items-center g-3">
                            <div class="col-md-6 d-flex align-items-center gap-3">
                                <div class="img-box">
                                    <img th:src="${order.imageUrl}" alt="product" class="img-fluid">
                                </div>
                                <div>
                                    <div class="order-name text-dark fw-bold" th:text="${order.variantName}">Product Name</div>
                                    <div class="order-extras text-muted small" th:if="${order.totalItems > 1}"
                                         th:text="'+' + (${order.totalItems} - 1) + ' more items'"></div>
                                </div>
                            </div>

                            <div class="col-md-2 text-md-center">
                                <span class="order-amount text-dark" th:text="'₹' + ${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')}">₹0</span>
                            </div>

                            <div class="col-md-4 text-md-end">
                                <div class="status-container">
                                    <span class="status-label text-muted small">Status: </span>
                                    <span th:text="${order.status}"
                                          th:classappend="${order.status.name() == 'CANCELLED'} ? 'status-cancelled' : 'status-delivered'">
                              Status
                        </span>
                                    <span class="ms-2 text-muted">›</span> </div>
                            </div>
                        </div>
                    </div>
                </a>
            </div>

            <nav th:if="${totalPages > 1}" class="mt-5">
                <ul class="pagination justify-content-center gap-2">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link ajax-page-link"
                           href="javascript:void(0)"
                           th:data-page="${currentPage - 1}">Previous</a>
                    </li>

                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link ajax-page-link"
                           href="javascript:void(0)"
                           th:text="${i + 1}"
                           th:data-page="${i}">1</a>
                    </li>

                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link ajax-page-link"
                           href="javascript:void(0)"
                           th:data-page="${currentPage + 1}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</main>

<div th:insert="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/order.js}"></script>
</body>
</html>
