<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>ToMobs - My Wishlist</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/wishlist.css}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>

<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="container wishlist-container">
    <h2 class="wishlist-title">My Wishlist</h2>

    <div class="wishlist-card" th:if="${!#lists.isEmpty(wishlistItems)}">

        <div class="wishlist-item" th:each="item : ${wishlistItems}">

            <div class="item-img-wrapper">
                <img th:src="@{${item.primaryImageName}}" th:alt="${item.productName}">
            </div>

            <div class="item-details flex-grow-1">
                <div class="item-title" th:text="${item.productName + ' (' + item.variantName + ')'}">
                    Product Name (Variant)
                </div>

                <div>
                    <span class="item-price" th:text="${'₹' + #numbers.formatDecimal(item.price, 0, 'COMMA', 2, 'POINT')}">₹0.00</span>
                    <span class="item-discount">5% Off</span> </div>

                <a href="#" class="add-to-cart-btn" th:data-variant-id="${item.variantId}">Add To Cart</a>
            </div>

            <div class="item-actions">
                <button class="remove-btn" title="Remove from Wishlist" th:data-variant-id="${item.variantId}">
                    <i class="bi bi-trash3-fill"></i>
                </button>
            </div>

        </div>
    </div>

    <div class="wishlist-card text-center py-5" th:if="${#lists.isEmpty(wishlistItems)}">
        <i class="bi bi-heart text-muted mb-3" style="font-size: 3rem;"></i>
        <h5 class="text-secondary fw-semibold">Your wishlist is empty!</h5>
        <p class="text-muted" style="font-size: 13px;">Save items that you like in your wishlist.</p>
        <a th:href="@{/products}" class="btn btn-dark mt-2" style="font-size: 13px; border-radius: 8px;">Explore Products</a>
    </div>

</div>

<div th:insert="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/wishlist.js}"></script>
</body>
</html>
