<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>ToMobs - My Wishlist</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/wishlist.css}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>

<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="container wishlist-container">
    <h3 class="wishlist-title">My Wishlist</h3>

    <div class="wishlist-card">

        <div class="wishlist-item">
            <div class="item-img-wrapper">
                <img src="https://fdn2.gsmarena.com/vv/bigpic/vivo-v29e.jpg" alt="vivo Y39 5G">
            </div>

            <div class="item-details flex-grow-1">
                <div class="item-title">vivo Y39 5G (Ocean Blue, 256 GB, 8GB RAM)</div>
                <div>
                    <span class="item-price">₹19,990</span>
                    <span class="item-discount">5% Off</span>
                </div>
                <a href="#" class="add-to-cart-btn">Add To Cart</a>
            </div>

            <div class="item-actions">
                <button class="remove-btn" title="Remove from Wishlist">
                    <i class="bi bi-trash3-fill"></i>
                </button>
            </div>
        </div>

        <div class="wishlist-item">
            <div class="item-img-wrapper">
                <img src="https://fdn2.gsmarena.com/vv/bigpic/vivo-v29e.jpg" alt="vivo Y39 5G">
            </div>

            <div class="item-details flex-grow-1">
                <div class="item-title">vivo Y39 5G (Ocean Blue, 256 GB, 8GB RAM)</div>
                <div>
                    <span class="item-price">₹19,990</span>
                    <span class="item-discount">5% Off</span>
                </div>
                <a href="#" class="add-to-cart-btn">Add To Cart</a>
            </div>

            <div class="item-actions">
                <button class="remove-btn" title="Remove from Wishlist">
                    <i class="bi bi-trash3-fill"></i>
                </button>
            </div>
        </div>

        <div class="wishlist-item">
            <div class="item-img-wrapper">
                <img src="https://fdn2.gsmarena.com/vv/bigpic/vivo-v29e.jpg" alt="vivo Y39 5G">
            </div>

            <div class="item-details flex-grow-1">
                <div class="item-title">vivo Y39 5G (Ocean Blue, 256 GB, 8GB RAM)</div>
                <div>
                    <span class="item-price">₹19,990</span>
                    <span class="item-discount">5% Off</span>
                </div>
                <a href="#" class="add-to-cart-btn">Add To Cart</a>
            </div>

            <div class="item-actions">
                <button class="remove-btn" title="Remove from Wishlist">
                    <i class="bi bi-trash3-fill"></i>
                </button>
            </div>
        </div>

    </div>
</div>

<div th:insert="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
