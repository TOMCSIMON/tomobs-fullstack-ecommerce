<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/order-success.css}">
</head>

<body class="d-flex flex-column min-vh-100">

<div th:insert="~{fragments/navbar :: navbar}"></div>
<main class="container flex-grow-1 d-flex justify-content-center align-items-center mt-5">

    <div class="order-success-card text-center shadow ">

        <h4 class="mb-3 text-success mt-2">Thank you for your order</h4>
        <h4 class="mb-1 mt-2">Your order has been successfully placed</h4>

        <img th:src="@{/images/order-success.jpg}"
             alt="Order Success"
             class="order-success-img mb-3 mt-3">

        <div class="d-flex gap-3 justify-content-center">
            <a href="#" class="btn btn-dark px-4">
                View Details
            </a>
            <a th:href="@{/products}" class="btn btn-success px-4">
                Continue Shopping
            </a>
        </div>
    </div>

</main>

<div th:insert="~{fragments/footer :: footer}"></div>

</body>
</html>
