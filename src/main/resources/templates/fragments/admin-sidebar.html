<div th:fragment="adminSidebar" class="offcanvas-md offcanvas-start admin-sidebar" tabindex="-1" id="adminSidebar" xmlns:th="http://www.thymeleaf.org">

    <div class="offcanvas-header d-md-none border-bottom">
        <h5 class="offcanvas-title admin-brand m-0">Menu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#adminSidebar"></button>
    </div>

    <div class="offcanvas-body d-flex flex-column p-0">
        <ul class="sidebar-menu w-100">
            <li>
                <a th:href="@{/admin/dashboard}" class="sidebar-link">
                    <i class="bi bi-grid me-2"></i> Dashboard
                </a>
            </li>
            <li>
                <a th:href="@{/admin/categories}" class="sidebar-link">
                    <i class="bi bi-tags me-2"></i> Categories
                </a>
            </li>
            <li>
                <a th:href="@{/admin/brands}" class="sidebar-link">
                    <i class="bi bi-award me-2"></i> Brands
                </a>
            </li>
            <li>
                <a th:href="@{/admin/products}" class="sidebar-link">
                    <i class="bi bi-box-seam me-2"></i> Products
                </a>
            </li>
            <li>
                <a th:href="@{/admin/users}" class="sidebar-link active">
                    <i class="bi bi-people me-2"></i> Users
                </a>
            </li>

            <li class="mt-auto border-top"> <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="sidebar-link logout-btn w-100 text-start border-0 bg-transparent text-danger">
                    <i class="bi bi-box-arrow-right me-2"></i> Logout
                </button>
            </form>
            </li>
        </ul>
    </div>
</div>
