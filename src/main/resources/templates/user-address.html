<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Address - ToMobs</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/user-address.css}">
</head>

<body>

<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="user-layout">
    <main class="flex-grow-1 mt-5 container address-main-container">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="page-title">My Address</h2>
            <button class="btn-black-add" data-bs-toggle="modal" data-bs-target="#addAddressModal">
                + Add Address
            </button>
        </div>



            <div th:each="address, iterStat : ${addressList}">

                <div class="address-card">

                    <div class="card-left">
                        <div class="name-row">
                            <h5 th:text="${address.fullName}">name</h5>
                            <span th:if="${address.default}" class="default" title="Default Address">default</span>
                        </div>
                        <p class="address-text">
                            <span th:text="${address.addressLine1}"> </span>
                            <span th:if="${address.addressLine2}" th:text="${address.addressLine2} + ', '"></span><br>
                            <span th:text="${address.city}">city</span>,
                            <span th:text="${address.state}">district</span>,<br>
                            <span th:text="${address.country}">state</span>,
                            <span th:text="${address.postalCode}">pin</span>,<br>
                            <span class="phone-number" th:text="${address.phoneNumber}"></span>
                        </p>
                    </div>

                    <div class="card-right">
                        <button class="edit-icon-btn"
                                data-bs-toggle="modal"
                                data-bs-target="#editAddressModal"
                                th:attr="data-id=${address.id},
                                         data-fullname=${address.fullName},
                                         data-phone=${address.phoneNumber},
                                         data-line1=${address.addressLine1},
                                         data-line2=${address.addressLine2},
                                         data-city=${address.city},
                                         data-state=${address.state},
                                         data-zip=${address.postalCode},
                                         data-country=${address.country},
                                         data-default=${address.default}"
                                onclick="populateEditModal(this)">
                            <i class="bi bi-pencil"></i>
                        </button>

                        <button class="btn-black-delete"
                                data-bs-toggle="modal"
                                data-bs-target="#deleteAddressModal"
                                th:attr="data-id=${address.id}"
                                onclick="setDeleteId(this)">
                            Delete
                        </button>
                    </div>

                </div>

                <div class="divider" th:if="${!iterStat.last}"></div>

            </div>

            <div class="text-center my-5" th:if="${#lists.isEmpty(addressList)}">
                <p class="text-muted fs-5">No addresses added yet. Click "+ Add Address" to get started.</p>
            </div>

    </main>
</div>


<div class="modal fade" id="addAddressModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content custom-modal">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold fs-4">Add New Address</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/address/add}" th:object="${userAddressAddDTO}" method="post">
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-muted small">Full Name</label>
                            <input type="text" class="form-control" th:field="*{fullName}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-muted small">Phone Number</label>
                            <input type="text" class="form-control" th:field="*{phoneNumber}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small">Street Address</label>
                        <input type="text" class="form-control" th:field="*{addressLine1}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small">Address Line 2 (Optional)</label>
                        <input type="text" class="form-control" th:field="*{addressLine2}">
                    </div>
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label text-muted small">City</label>
                            <input type="text" class="form-control" th:field="*{city}" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label text-muted small">State</label>
                            <input type="text" class="form-control" th:field="*{state}" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label text-muted small">Postal code</label>
                            <input type="text" class="form-control" th:field="*{postalCode}" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label text-muted small">Country</label>
                            <input type="text" class="form-control" th:field="*{country}" required>
                        </div>
                    </div>
                    <div class="form-check mt-2">
                        <input class="form-check-input" type="checkbox" th:field="*{isDefault}" id="defaultCheckAdd">
                        <label class="form-check-label fw-medium" for="defaultCheckAdd">Set as default address</label>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-black-add px-5">Save Address</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="editAddressModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content custom-modal">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold fs-4">Edit Address</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="editAddressForm" th:action="@{/address/edit}" method="post">
                <input type="hidden" name="id" id="editId">
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-muted small">Full Name</label>
                            <input type="text" class="form-control" name="fullName" id="editFullName" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-muted small">Phone Number</label>
                            <input type="text" class="form-control" name="phoneNumber" id="editPhone" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small">Street Address</label>
                        <input type="text" class="form-control" name="addressLine1" id="editLine1" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small">Address Line 2 (Optional)</label>
                        <input type="text" class="form-control" name="addressLine2" id="editLine2">
                    </div>
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label text-muted small">City</label>
                            <input type="text" class="form-control" name="city" id="editCity" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label text-muted small">State</label>
                            <input type="text" class="form-control" name="state" id="editState" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label text-muted small">Postal code</label>
                            <input type="text" class="form-control" name="postalCode" id="editZip" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label text-muted small">Country</label>
                            <input type="text" class="form-control" name="country" id="editCountry" required>
                        </div>
                    </div>
                    <div class="form-check mt-2">
                        <input class="form-check-input" type="checkbox" name="isDefault" id="editDefaultCheck">
                        <label class="form-check-label fw-medium" for="editDefaultCheck">Set as default address</label>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-black-add px-5">Update Address</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteAddressModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-center p-4" style="border-radius: 12px;">
            <div class="d-flex justify-content-end">
                <button type="button" class="btn-close fs-4" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body pt-0">
                <h2 class="fw-bold mb-4" style="font-size: 2rem; color: #dc3545;">ARE YOU SURE?</h2>
                <h4 class="mb-4" style="color: #333; line-height: 1.5;">
                    Do you really want to delete this address?
                </h4>
                <button type="button" id="confirmDeleteBtn" class="btn btn-danger px-5 py-2 fw-bold" style="border-radius: 8px; font-size: 1.1rem;">
                    Yes, Delete
                </button>
            </div>
        </div>
    </div>
</div>

<div th:insert="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/user-address.js}"></script>
<script th:src="@{/js/toast.js}"></script>

</body>
</html>
